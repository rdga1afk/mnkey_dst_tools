name: CI

on:
  push:
    branches: [master]
    paths:
      - '**.py'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**.py'
  workflow_dispatch: {}

jobs:
  # Public repo → free minutes. The C++ editor is built from the main repository
  # (it needs engine/ as a sibling), so here we only check that every Python tool parses.
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Byte-compile all Python tools
        run: |
          find . -name '*.py' -not -path './third_party/*' -print0 \
            | xargs -0 python3 -m py_compile
