name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH_DATE: "2026/11/12"   # keep equal to .github/workflows/package.yml and the engine repo (bump with the laptop's pacman -Syu)
  EXPECT: "clang 23.1.4-1|gcc-libs 16.2.1+r23+gd564253eb6c8-1|glibc 2.44+r50+g1848099f063e-1|sdl3 3.4.20-1|lua54 5.4.9-1|cmake 4.4.5-1"

jobs:
  # Public repo → free minutes. This job only checks that every Python tool parses; the C++ build is the `standalone` job below.
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Byte-compile all Python tools
        run: |
          find . -name '*.py' -not -path './third_party/*' -print0 \
            | xargs -0 python3 -m py_compile

  # The repo builds on its own: engine is the submodule tools/engine; no private file, no Kenshi file, no secret. The tests that need an install (KENSHI_DIR) are not run here.
  standalone:
    permissions:
      contents: write   # the release game is published on GitHub Release build-<sha12> (push only)
    name: Standalone build, unit tests, scans
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container: archlinux:latest
    steps:
      - name: Toolchain (Arch Linux Archive snapshot = the laptop's package set)
        run: |
          echo "Server = https://archive.archlinux.org/repos/${ARCH_DATE}/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm
          pacman -S --noconfirm --needed base-devel clang cmake ninja git ccache zstd github-cli sdl3 lua54 mold freetype2 shaderc glslang python pkgconf gtest vulkan-headers vulkan-icd-loader
          echo "$EXPECT" | tr '|' '\n' | while read -r n v; do
            got=$(pacman -Q "$n" | cut -d' ' -f2)
            echo "$n: laptop $v, container $got"
            [ "$got" = "$v" ] || { echo "::error::$n differs from the laptop ($v)"; exit 1; }
          done
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: git safe directory
        run: git config --global --add safe.directory '*'
      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-standalone-${{ github.sha }}
          restore-keys: ccache-standalone-
      # renderdoc_app.h (MIT, one header; the laptop has the same file from renderdoc-bin 1.45): fetched pinned and checksummed, same as the engine's package.yml
      - name: renderdoc_app.h
        run: |
          curl -sSfL -o /usr/local/include/renderdoc_app.h https://raw.githubusercontent.com/baldurk/renderdoc/v1.45/renderdoc/api/app/renderdoc_app.h
          echo "b7005e7dc34c3635046868bbd76d81b9b055aede0f56daa0bd39fedee0639ffb  /usr/local/include/renderdoc_app.h" | sha256sum -c -
      - name: Configure
        run: |
          export CC=clang CXX=clang++
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMD_MARCH=skylake
      - name: Build (game, editor, tests)
        run: cmake --build build -j"$(nproc)"
      - name: Shader inventory (public build, #207 release configuration — every missing world-surface shader has a run-time replacement)
        run: python3 scripts/shader_inventory.py --spirv shaders/spirv
      - name: Unit tests that need no install
        run: ctest --test-dir build -L fast -LE needs-install --output-on-failure --timeout 120
      - name: Decompilation-pattern scan (counts, file:line only; 0 expected for addresses and decompiler names)
        run: |
          python3 scripts/migration_scan.py game shaders tests editor | tee scan.txt
          grep -E '^(A_ghidra_id|B_exe_addr) ' scan.txt | awk '{ if ($2 != 0) bad = 1 } END { exit bad }'
      - name: Licences (every vendored folder has a licence file and a THIRD_PARTY.md row)
        run: python3 scripts/check_licences.py
      - name: Release binary (no Dear ImGui Test Engine, no GPL-class libraries)
        run: bash scripts/check_release_binary.sh build/game/monkey_dust build/monkey_dust_editor
      - name: Publish the release game (game-<sha12>.tar.zst on GitHub Release build-<sha12>; the laptop fetches it instead of building, owner 12.11 / 13.11)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA12=${GITHUB_SHA:0:12}
          mkdir -p gout/bin && cp build/game/monkey_dust gout/bin/
          tar -I 'zstd -19' -cf game-${SHA12}.tar.zst -C gout .
          sha256sum game-${SHA12}.tar.zst > game-${SHA12}.tar.zst.sha256
          ls -l game-${SHA12}.tar.zst
          gh release view "build-${SHA12}" >/dev/null 2>&1 || gh release create "build-${SHA12}" --target "$GITHUB_SHA" --title "Tools build ${SHA12}" --notes "Prebuilt tools and the release game (no shader overlay) for tools commit ${GITHUB_SHA}. No Kenshi files." || true
          gh release upload "build-${SHA12}" game-${SHA12}.tar.zst game-${SHA12}.tar.zst.sha256 --clobber
