# monkey_dust tasks.cfg — VBfA-style job system config
# Format: key value (one per line, # = comment)
#
# worker_threads: number of background worker threads (0 = auto: CPU_count-1)
# batch_size:     items per submitted job; callers use JobSystem::BatchSize()
#
# VBfA source: Tasks.txt (line 390926: "Creating %d worker threads"),
#              batch_size key (line 43185)
#
# worker_threads=2, not auto (docs/archive/GRANITE_MIGRATION_RECON.md Block 1):
# this machine already runs ~14 persistent threads across 6 uncoordinated
# pools on 4 hardware threads (~3.5x oversubscribed) before this job system
# is even counted -- Jolt (2), TerrainStreamQueue (1), NavSystem (1),
# CrowdSystem (4), miniaudio (~2), main (1). Reducing JobSystem's own share
# from cores-1 (3 here) to 2 frees a slot without disabling anything.
worker_threads 2
batch_size 16
